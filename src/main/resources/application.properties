# Server Configuration
# Using port 8085 by default to avoid conflicts with other local services
server.port=${PORT:8085}
server.servlet.context-path=/

# Application Information
spring.application.name=NGO Project Progress Dashboard
app.version=1.0.0
app.environment=${DEPLOY_ENV:development}
app.seed.data=${SEED_DATA:true}

# Embedded H2 Database Configuration (Zero-setup, in-memory)
spring.datasource.url=jdbc:h2:mem:ngodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console Configuration (Audit and inspect tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Spring Boot Actuator Endpoints (Health Check & Telemetry)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=NGO Project Progress Dashboard
info.app.version=1.0.0
info.app.description=Grassroots Humanitarian Mission Tracker
