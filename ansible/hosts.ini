[local]
localhost ansible_connection=local

[staging]
staging-server.ngo.org ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/devops_key

[production]
prod-server.ngo.org ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/devops_key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=ngo-project-dashboard
app_version=1.0.0
app_port=8080
deploy_user=ngoapp
deploy_group=ngogroup
deploy_dir=/opt/ngo-dashboard
