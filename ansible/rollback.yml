---
# ========================================================
# Ansible Rollback Playbook: Revert to Previous Stable Image
# ========================================================
- name: Rollback NGO Project Dashboard
  hosts: all
  become: yes
  vars:
    rollback_image: "{{ ROLLBACK_VERSION | default('ngo-project-dashboard:1.0.0-stable') }}"
    container_name: "ngo-dashboard-live"
    exposed_port: 8080

  tasks:
    - name: 1. Announce Rollback Procedure
      debug:
        msg: "Initiating emergency rollback to stable image: {{ rollback_image }}"

    - name: 2. Stop and remove degraded container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: 3. Launch container using previously validated stable image
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ rollback_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ exposed_port }}:8080"
        env:
          DEPLOY_ENV: "production-rollback"

    - name: 4. Verify post-rollback health status
      uri:
        url: "http://localhost:{{ exposed_port }}/health"
        method: GET
        status_code: 200
        return_content: yes
      register: rollback_health
      until: rollback_health.status == 200
      retries: 6
      delay: 3

    - name: 5. Update release tracking metadata
      copy:
        content: |
          DEPLOYED_IMAGE={{ rollback_image }}
          ROLLBACK_EXECUTED_AT={{ ansible_date_time.iso8601 }}
          STATUS=ROLLED_BACK
        dest: "{{ deploy_dir }}/releases/current_release.env"

    - name: 6. Confirm rollback resolution
      debug:
        msg: "Rollback Complete! Application restored to healthy state running {{ rollback_image }}"
